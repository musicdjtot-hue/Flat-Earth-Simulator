name: Build Android 16-17 APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Сборка APK для Android 16–17 (SDK 36)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK (API 36 / Android 16-17)
        uses: android-actions/setup-android@v3

      - name: Install Android 16-17 SDK Platform & Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Build Vite bundle
        run: npm run build

      - name: Configure Capacitor Android 16-17 project
        run: node scripts/setup-android.mjs

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK output
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/Azimut-40-Android-16-17.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Azimut-40-Android-16-17-APK
          path: release-apk/Azimut-40-Android-16-17.apk
          retention-days: 30
